[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0", "cmake>=3.15", "mypy"]
build-backend = "setuptools.build_meta"

[project]
name = "euklid"
version = "0.2.8"
description = "Common vector operations [2D/3D]"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "airgproducts", email = "info@airg.family" }
]
keywords = ["vector", "geometry", "2d", "3d", "mathematics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/airgproducts/euklid"
Repository = "https://github.com/airgproducts/euklid"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
version = ["src/version.hpp"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

# NOTE: This package contains C++ extensions built with CMake/pybind11
# For future Rust migration, consider using maturin as the build backend
# Example future migration:
# [build-system]
# requires = ["maturin>=1.0,<2.0"]
# build-backend = "maturin"
